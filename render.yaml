services:
  - type: web
    name: pra-connector-backend
    runtime: node
    plan: free
    buildCommand: npm run build && npx prisma migrate deploy
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: FRONTEND_URL
        value: https://pra-connector-frontend.vercel.app
      - key: QBO_REDIRECT_URI
        value: https://pra-connector-backend.onrender.com/api/qbo/callback
      # Production Intuit keys must be set in Render dashboard (QBO_CLIENT_ID / QBO_CLIENT_SECRET).
      - key: QBO_ENVIRONMENT
        value: production
      # Shared with local .env — signs Render → localhost OAuth handoff payloads.
      - key: QBO_HANDOFF_SECRET
        value: pra-qbo-local-handoff-shared-2026
