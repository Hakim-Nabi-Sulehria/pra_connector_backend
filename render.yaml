services:
  - type: web
    name: pra-connector-backend
    runtime: node
    plan: free
    buildCommand: npm run build && npx prisma migrate deploy
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      # Local frontend only — Render is OAuth callback + handoff, not the app UI.
      - key: FRONTEND_URL
        value: http://localhost:5173
      - key: QBO_REDIRECT_URI
        value: https://pra-connector-backend.onrender.com/api/qbo/callback
      - key: QBO_ENVIRONMENT
        value: production
      - key: QBO_HANDOFF_SECRET
        value: pra-qbo-local-handoff-shared-2026
      - key: QBO_STATE_SECRET
        value: pra-qbo-local-handoff-shared-2026
